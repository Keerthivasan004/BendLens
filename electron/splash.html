<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BendLens - Universal Backend Architecture Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 70%, #000000 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 440px;
      padding: 32px;
      position: relative;
    }
    .glow-sphere {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(99, 102, 241, 0.1) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(30px);
      z-index: 0;
      animation: pulse-glow 3s ease-in-out infinite alternate;
    }
    .logo-box {
      position: relative;
      z-index: 1;
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.6));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px -8px rgba(14, 165, 233, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    .logo-box svg {
      width: 44px;
      height: 44px;
      stroke: #38bdf8;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }
    .brand-title {
      position: relative;
      z-index: 1;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      position: relative;
      z-index: 1;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }
    .progress-bar-wrapper {
      position: relative;
      z-index: 1;
      width: 260px;
      height: 4px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .progress-bar-inner {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #818cf8);
      border-radius: 999px;
      animation: indeterminate 1.4s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .status-text {
      position: relative;
      z-index: 1;
      font-size: 12px;
      color: #38bdf8;
      font-weight: 500;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
      animation: blink 1s infinite alternate;
    }
    .badge-privacy {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.4px;
    }

    @keyframes pulse-glow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%) scaleX(0.5); }
      50% { transform: translateX(50%) scaleX(1); }
      100% { transform: translateX(200%) scaleX(0.5); }
    }
    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="glow-sphere"></div>
  <div class="container">
    <div class="logo-box">
      <!-- Lens / Architecture Icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3a9 9 0 0 0 0 18"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </div>
    <div class="brand-title">BendLens Studio</div>
    <div class="brand-subtitle">Universal Backend Architecture & Blast Platform</div>
    
    <div class="progress-bar-wrapper">
      <div class="progress-bar-inner"></div>
    </div>

    <div class="status-text" id="status-label">
      <span class="status-dot"></span>
      <span id="status-msg">Starting Private Engine...</span>
    </div>
  </div>

  <div class="badge-privacy">
    🔒 100% Local &amp; Air-Gapped Privacy Architecture
  </div>

  <script>
    const msgs = [
      'Initializing Private Engine...',
      'Connecting to Local Studio...',
      'Warming Architecture Canvas...',
      'Ready to Launch...'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % msgs.length;
      const el = document.getElementById('status-msg');
      if (el) el.textContent = msgs[idx];
    }, 1200);
  </script>
</body>
</html>
