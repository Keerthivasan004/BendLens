<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BendLens - Universal Backend Architecture Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 70%, #000000 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 440px;
      padding: 32px;
      position: relative;
    }
    .glow-sphere {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(99, 102, 241, 0.1) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(30px);
      z-index: 0;
      animation: pulse-glow 3s ease-in-out infinite alternate;
    }
    .logo-box {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.7));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 36px -8px rgba(14, 165, 233, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    .logo-box svg {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
    }
    .brand-title {
      position: relative;
      z-index: 1;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      position: relative;
      z-index: 1;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }
    .progress-bar-wrapper {
      position: relative;
      z-index: 1;
      width: 260px;
      height: 4px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .progress-bar-inner {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #818cf8);
      border-radius: 999px;
      animation: indeterminate 1.4s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .status-text {
      position: relative;
      z-index: 1;
      font-size: 12px;
      color: #38bdf8;
      font-weight: 500;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
      animation: blink 1s infinite alternate;
    }
    .badge-privacy {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.4px;
    }

    @keyframes pulse-glow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%) scaleX(0.5); }
      50% { transform: translateX(50%) scaleX(1); }
      100% { transform: translateX(200%) scaleX(0.5); }
    }
    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="glow-sphere"></div>
  <div class="container">
    <div class="logo-box">
      <!-- Official BendLens Brand Emblem -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="splash-db-top" x1="16" y1="12" x2="48" y2="24" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38bdf8" />
            <stop offset="0.5" stop-color="#0284c7" />
            <stop offset="1" stop-color="#1e3a8a" />
          </linearGradient>
          <linearGradient id="splash-db-mid" x1="16" y1="24" x2="48" y2="36" gradientUnits="userSpaceOnUse">
            <stop stop-color="#60a5fa" />
            <stop offset="0.5" stop-color="#2563eb" />
            <stop offset="1" stop-color="#1e293b" />
          </linearGradient>
          <linearGradient id="splash-db-bot" x1="16" y1="36" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#818cf8" />
            <stop offset="0.5" stop-color="#4f46e5" />
            <stop offset="1" stop-color="#0f172a" />
          </linearGradient>
          <linearGradient id="splash-lens-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38bdf8" />
            <stop offset="0.3" stop-color="#818cf8" />
            <stop offset="0.7" stop-color="#c084fc" />
            <stop offset="1" stop-color="#38bdf8" />
          </linearGradient>
          <radialGradient id="splash-node-glow" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
          </radialGradient>
        </defs>

        <rect x="2" y="2" width="60" height="60" rx="16" fill="#090c14" stroke="#283144" stroke-width="1.5" />

        <g opacity="0.6">
          <line x1="12" y1="18" x2="32" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
          <line x1="52" y1="18" x2="32" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
          <line x1="12" y1="46" x2="32" y2="46" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" />
          <line x1="52" y1="46" x2="32" y2="46" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" />
          <line x1="12" y1="18" x2="12" y2="46" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="52" y1="18" x2="52" y2="46" stroke="#818cf8" stroke-width="1.5" />
        </g>

        <path d="M20 38 C20 35 44 35 44 38 L44 44 C44 47 20 47 20 44 Z" fill="url(#splash-db-bot)" stroke="#6366f1" stroke-width="1" />
        <ellipse cx="32" cy="38" rx="12" ry="3.5" fill="#312e81" stroke="#818cf8" stroke-width="1" />

        <path d="M20 28 C20 25 44 25 44 28 L44 34 C44 37 20 37 20 34 Z" fill="url(#splash-db-mid)" stroke="#3b82f6" stroke-width="1" />
        <ellipse cx="32" cy="28" rx="12" ry="3.5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />

        <path d="M20 18 C20 15 44 15 44 18 L44 24 C44 27 20 27 20 24 Z" fill="url(#splash-db-top)" stroke="#0284c7" stroke-width="1" />
        <ellipse cx="32" cy="18" rx="12" ry="3.5" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2" />

        <circle cx="32" cy="31" r="19" stroke="url(#splash-lens-ring)" stroke-width="2" stroke-dasharray="14 4" />

        <circle cx="12" cy="18" r="3.5" fill="url(#splash-node-glow)" stroke="#ffffff" stroke-width="1" />
        <circle cx="52" cy="18" r="3.5" fill="url(#splash-node-glow)" stroke="#ffffff" stroke-width="1" />
        <circle cx="12" cy="46" r="3.5" fill="url(#splash-node-glow)" stroke="#ffffff" stroke-width="1" />
        <circle cx="52" cy="46" r="3.5" fill="url(#splash-node-glow)" stroke="#ffffff" stroke-width="1" />

        <circle cx="32" cy="31" r="3" fill="#38bdf8" />
        <circle cx="32" cy="31" r="1.5" fill="#ffffff" />
      </svg>
    </div>
    <div class="brand-title">BendLens Studio</div>
    <div class="brand-subtitle">Universal Backend Architecture & Blast Platform</div>
    
    <div class="progress-bar-wrapper">
      <div class="progress-bar-inner"></div>
    </div>

    <div class="status-text" id="status-label">
      <span class="status-dot"></span>
      <span id="status-msg">Starting Private Engine...</span>
    </div>
  </div>

  <div class="badge-privacy">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    100% Local &amp; Air-Gapped Privacy Architecture
  </div>

  <script>
    const msgs = [
      'Initializing Private Engine...',
      'Connecting to Local Studio...',
      'Warming Architecture Canvas...',
      'Ready to Launch...'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % msgs.length;
      const el = document.getElementById('status-msg');
      if (el) el.textContent = msgs[idx];
    }, 1200);
  </script>
</body>
</html>
